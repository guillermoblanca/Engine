<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laboratorio GB Engine</title>
<style>
  :root { --bg:#f6f5f2; --panel:#fff; --fg:#1f1d1a; --mut:#6d6a63; --line:#e3e0d9; --acc:#2d6cdf; --ok:#1f8a4c; --warn:#b7791f; --bad:#c0392b;
          --c0:#2d6cdf; --c1:#d9534f; --c2:#2a9d8f; --c3:#e0a100; --c4:#8e5bd1; --c5:#e36bae; --c6:#6b8e23; --c7:#8a6d3b; }
  @media (prefers-color-scheme: dark) { :root { --bg:#16151a; --panel:#201f26; --fg:#ecebe6; --mut:#9b98a1; --line:#34323c; --acc:#6ea0ff; --ok:#4cc38a; --warn:#e0a84a; --bad:#f06b5e;
          --c0:#6ea0ff; --c1:#f07b78; --c2:#4cc3b3; --c3:#f0c040; --c4:#b58cf0; --c5:#f08ac4; --c6:#9cc34a; --c7:#c9a46a; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display:flex; align-items:center; gap:16px; padding:10px 20px; border-bottom:1px solid var(--line); background:var(--panel); position:sticky; top:0; z-index:10; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  nav button { font:inherit; color:var(--mut); background:none; border:0; padding:6px 12px; border-bottom:2px solid transparent; cursor:pointer; }
  nav button.on { color:var(--fg); border-color:var(--acc); }
  main { max-width:1280px; margin:0 auto; padding:16px 20px 60px; }
  h2 { font-size:16px; margin:28px 0 8px; }
  h3 { font-size:13px; margin:0 0 4px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:14px 16px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap:12px; }
  .note { color:var(--mut); font-size:12px; margin:0 0 8px; }
  label { display:inline-flex; flex-direction:column; gap:3px; font-size:12px; color:var(--mut); }
  input, select, button.btn { font:inherit; color:var(--fg); background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:6px 8px; }
  button.btn { cursor:pointer; background:var(--acc); color:#fff; border-color:var(--acc); }
  button.btn.sec { background:var(--panel); color:var(--fg); border-color:var(--line); }
  button.btn:disabled { opacity:.5; cursor:default; }
  .form { display:flex; flex-wrap:wrap; gap:12px; align-items:flex-end; }
  .chk { flex-direction:row; align-items:center; gap:6px; color:var(--fg); }
  table { border-collapse:collapse; width:100%; font-size:12px; font-variant-numeric:tabular-nums; }
  th, td { text-align:right; padding:4px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th:first-child, td:first-child, td.l, th.l { text-align:left; }
  th { color:var(--mut); font-weight:500; }
  tr.click { cursor:pointer; } tr.click:hover { background:var(--bg); }
  .scroll { max-height:340px; overflow:auto; }
  .pill { display:inline-block; padding:1px 8px; border-radius:10px; font-size:11px; border:1px solid var(--line); }
  .ok { color:var(--ok); } .warn { color:var(--warn); } .bad { color:var(--bad); } .mut { color:var(--mut); }
  .find { border-left:3px solid var(--line); padding:6px 10px; margin:6px 0; background:var(--panel); border-radius:0 6px 6px 0; }
  .find.ok { border-color:var(--ok); } .find.warn { border-color:var(--warn); } .find.bad { border-color:var(--bad); }
  .find b { display:block; color:var(--fg); }
  .chart { position:relative; min-height:200px; }
  .tip { position:absolute; pointer-events:none; background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:4px 8px; font-size:12px; display:none; white-space:nowrap; z-index:5; box-shadow:0 2px 8px #0003; }
  .sw { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:5px; }
  .legend { display:flex; gap:12px; flex-wrap:wrap; font-size:12px; margin-bottom:4px; }
  .tabs2 { display:flex; gap:4px; flex-wrap:wrap; margin-bottom:8px; }
  .tabs2 button { font:inherit; background:var(--panel); color:var(--mut); border:1px solid var(--line); border-radius:14px; padding:3px 12px; cursor:pointer; }
  .tabs2 button.on { color:#fff; background:var(--acc); border-color:var(--acc); }
  pre { margin:0; white-space:pre-wrap; font-size:12px; }
  .bar { height:8px; border-radius:4px; background:var(--acc); display:inline-block; vertical-align:middle; }
  svg text { fill:var(--mut); font-size:11px; }
</style>
</head>
<body>
<header>
  <h1>Laboratorio GB Engine</h1>
  <nav id="nav"></nav>
  <span class="mut" id="cfg"></span>
</header>
<main>
  <section id="v-launch"></section>
  <section id="v-runs" hidden></section>
  <section id="v-result" hidden></section>
  <section id="v-compare" hidden></section>
</main>
<script>
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, attrs = {}, ...kids) => { const e = document.createElement(tag); for (const [k, v] of Object.entries(attrs)) { if (k === 'class') e.className = v; else if (k.startsWith('on')) e[k] = v; else if (v !== false && v != null) e.setAttribute(k, v === true ? '' : v); } for (const c of kids.flat()) if (c != null) e.append(c.nodeType ? c : document.createTextNode(String(c))); return e; };
const api = async (path, body) => { const r = await fetch(path, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {}); const j = await r.json(); if (j.error) throw new Error(j.error); return j; };
const fmt = (v, d = 1) => v == null ? '—' : Number(v).toFixed(d).replace(/\.0+$/, '');
const COLORS = Array.from({ length: 8 }, (_, i) => `var(--c${i})`);
const S = { view: 'launch', run: null, data: null, runs: [], tab: {} };

// ------------------------------------------------------------------------------------------------ charts
function lineChart(host, series, o = {}) {
  host.replaceChildren();
  const pts = series.flatMap((s) => s.pts);
  if (!pts.length) { host.append(el('p', { class: 'note' }, 'Sin datos.')); return; }
  const W = Math.max(280, host.clientWidth || 600), H = o.h || 230, m = { l: 42, r: o.labels === false ? 10 : 62, t: 8, b: 26 };
  const x0 = 0, x1 = Math.max(0.01, Math.max(...pts.map((p) => p[0])));
  let y0 = o.min != null ? o.min : Math.min(0, ...pts.map((p) => p[1])), y1 = o.max != null ? o.max : Math.max(1, ...pts.map((p) => p[1]));
  if (y1 === y0) y1 = y0 + 1;
  const X = (v) => m.l + (v - x0) / (x1 - x0) * (W - m.l - m.r), Y = (v) => H - m.b - (v - y0) / (y1 - y0) * (H - m.t - m.b);
  const ns = 'http://www.w3.org/2000/svg', svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.setAttribute('width', '100%'); svg.style.display = 'block';
  const add = (tag, a, text) => { const n = document.createElementNS(ns, tag); for (const k in a) n.setAttribute(k, a[k]); if (text != null) n.textContent = text; svg.append(n); return n; };
  const ticks = (a, b, n) => { const step = (b - a) / n, mag = 10 ** Math.floor(Math.log10(step || 1)), s = [1, 2, 5, 10].map((k) => k * mag).find((k) => k >= step) || step; const out = []; for (let v = Math.ceil(a / s) * s; v <= b + 1e-9; v += s) out.push(v); return out; };
  for (const v of ticks(y0, y1, 4)) { add('line', { x1: m.l, x2: W - m.r, y1: Y(v), y2: Y(v), stroke: 'var(--line)' }); add('text', { x: m.l - 6, y: Y(v) + 4, 'text-anchor': 'end' }, fmt(v, v % 1 ? 1 : 0)); }
  for (const v of ticks(x0, x1, 6)) add('text', { x: X(v), y: H - 8, 'text-anchor': 'middle' }, fmt(v, v % 1 ? 1 : 0));
  add('text', { x: W - m.r, y: H - 8, 'text-anchor': 'end' }, o.xLabel || 'días');
  series.forEach((s, i) => {
    const c = s.color || COLORS[i % 8]; let d = '';
    s.pts.forEach((p, k) => { d += (k ? (o.step ? `H${X(p[0])}V${Y(p[1])}` : `L${X(p[0])} ${Y(p[1])}`) : `M${X(p[0])} ${Y(p[1])}`); });
    add('path', { d, fill: 'none', stroke: c, 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-dasharray': s.dash || '' });
    const last = s.pts[s.pts.length - 1];
    if (last && o.labels !== false) add('text', { x: Math.min(W - 2, X(last[0]) + 4), y: Y(last[1]) + 4, fill: c, style: `fill:${c}` }, s.name);
  });
  const rule = add('line', { y1: m.t, y2: H - m.b, stroke: 'var(--mut)', 'stroke-dasharray': '3 3', style: 'display:none' });
  const tip = el('div', { class: 'tip' });
  const hit = add('rect', { x: m.l, y: m.t, width: W - m.l - m.r, height: H - m.t - m.b, fill: 'transparent' });
  hit.onpointermove = (ev) => {
    const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) * W / r.width, xv = x0 + (px - m.l) / (W - m.l - m.r) * (x1 - x0);
    rule.setAttribute('x1', px); rule.setAttribute('x2', px); rule.style.display = '';
    tip.replaceChildren(el('div', { class: 'mut' }, `${o.xLabel || 'día'} ${fmt(xv, 2)}`));
    series.forEach((s, i) => { let best = null; for (const p of s.pts) if (!best || Math.abs(p[0] - xv) < Math.abs(best[0] - xv)) best = p; if (best) tip.append(el('div', {}, el('span', { class: 'sw', style: `background:${s.color || COLORS[i % 8]}` }), `${s.name}: ${fmt(best[1], 2)}`)); });
    tip.style.display = 'block'; tip.style.left = Math.min(host.clientWidth - tip.offsetWidth - 4, Math.max(0, (ev.clientX - r.left) + 12)) + 'px'; tip.style.top = '4px';
  };
  hit.onpointerleave = () => { tip.style.display = 'none'; rule.style.display = 'none'; };
  host.append(svg, tip);
}
const chartCard = (title, note, build, o = {}) => { const host = el('div', { class: 'chart' }); const card = el('div', { class: 'card' }, el('h3', {}, title), note ? el('p', { class: 'note' }, note) : null, host); setTimeout(() => build(host), 0); return card; };
const tabs = (key, names, render) => {
  const box = el('div'), body = el('div'), bar = el('div', { class: 'tabs2' });
  const show = (n) => { S.tab[key] = n; [...bar.children].forEach((b) => b.classList.toggle('on', b.textContent === n)); body.replaceChildren(render(n)); };
  names.forEach((n) => bar.append(el('button', { onclick: () => show(n) }, n)));
  box.append(bar, body); show(names.includes(S.tab[key]) ? S.tab[key] : names[0]); return box;
};
const table = (cols, rows, o = {}) => el('div', { class: 'scroll' }, el('table', {}, el('thead', {}, el('tr', {}, cols.map((c) => el('th', { class: c.l ? 'l' : '' }, c.t)))),
  el('tbody', {}, rows.map((r) => el('tr', { class: o.onrow ? 'click' : '', onclick: o.onrow ? () => o.onrow(r) : null }, cols.map((c) => el('td', { class: c.l ? 'l' : '' }, c.f ? c.f(r) : r[c.k])))))));

// ------------------------------------------------------------------------------------------------ views
const NAV = [['launch', 'Lanzar simulación'], ['runs', 'Partidas'], ['result', 'Análisis'], ['compare', 'Comparar']];
function go(view) {
  S.view = view; for (const [k] of NAV) $('#v-' + k).hidden = k !== view;
  [...$('#nav').children].forEach((b, i) => b.classList.toggle('on', NAV[i][0] === view));
  ({ launch: viewLaunch, runs: viewRuns, result: viewResult, compare: viewCompare })[view]();
}
NAV.forEach(([k, t]) => $('#nav').append(el('button', { onclick: () => go(k) }, t)));

let jobsTimer = null;
function viewLaunch() {
  const root = $('#v-launch'); root.replaceChildren();
  const f = (id, label, v, extra = {}) => el('label', {}, label, el('input', { id, value: v, ...extra }));
  const form = el('div', { class: 'card' },
    el('h2', { style: 'margin-top:0' }, 'Lanzar una simulación'),
    el('p', { class: 'note' }, 'Una simulación sin ventana (GBSim). Un año de edad son 4 días simulados; un día simulado son 1200 s. Se detiene al cumplir los años o antes, si se da alguna condición de parada.'),
    el('div', { class: 'form' },
      f('p-years', 'Años de simulación', 2, { type: 'number', step: '0.25', min: '0.05' }), f('p-seed', 'Semilla', 1, { type: 'number' }), f('p-clans', 'Clanes', 3, { type: 'number', min: 1, max: 12 }),
      f('p-members', 'Miembros por clan', 4, { type: 'number', min: 1, max: 40 }),
      el('label', {}, 'Bioma', el('select', { id: 'p-biome' }, ['temperate', 'alpine', 'desert'].map((b) => el('option', { value: b }, b)))),
      f('p-every', 'Muestreo (s simulados)', 60, { type: 'number', min: 10 })),
    el('h3', { style: 'margin-top:14px' }, 'Condiciones de parada (opcionales)'),
    el('div', { class: 'form' },
      el('label', { class: 'chk' }, el('input', { type: 'checkbox', id: 'p-clan-dead' }), 'cuando muera un clan'),
      el('label', { class: 'chk' }, el('input', { type: 'checkbox', id: 'p-extinct' }), 'cuando mueran todos'),
      f('p-stag', 'o estancados: días sin superar su mejor población', '', { type: 'number', min: 0.5, step: '0.5', placeholder: 'sin límite' })),
    el('div', { class: 'form', style: 'margin-top:12px' },
      el('label', { class: 'chk' }, el('input', { type: 'checkbox', id: 'p-combat', checked: true }), 'combate e incursiones'),
      el('label', { class: 'chk' }, el('input', { type: 'checkbox', id: 'p-hostile' }), 'clanes hostiles desde el inicio'),
      el('button', { class: 'btn', id: 'go', onclick: launch }, 'Lanzar')),
    el('p', { class: 'note', id: 'launch-msg' }));
  root.append(form, el('h2', {}, 'En curso y recientes'), el('div', { id: 'jobs' }));
  refreshJobs(); clearInterval(jobsTimer); jobsTimer = setInterval(() => { if (S.view === 'launch') refreshJobs(); }, 1500);
}
async function launch() {
  const v = (id) => $('#' + id).value, c = (id) => $('#' + id).checked, stop = [];
  if (c('p-clan-dead')) stop.push('clan_dead'); if (c('p-extinct')) stop.push('extinct');
  try {
    const r = await api('/api/launch', { years: +v('p-years'), seed: +v('p-seed'), clans: +v('p-clans'), members: +v('p-members'), biome: v('p-biome'), every: +v('p-every'), combat: c('p-combat'), hostile: c('p-hostile'), stop, stagnant_days: v('p-stag') ? +v('p-stag') : 0 });
    $('#launch-msg').textContent = 'Lanzada: ' + r.name; refreshJobs();
  } catch (e) { $('#launch-msg').textContent = 'No se pudo lanzar: ' + e.message; }
}
async function refreshJobs() {
  const jobs = await api('/api/jobs'), box = $('#jobs'); if (!box) return;
  box.replaceChildren(jobs.length ? table([{ t: 'Partida', l: 1, k: 'name' }, { t: 'Estado', l: 1, f: (j) => j.done ? (j.code === 0 ? (j.stopped ? 'parada: ' + j.stopped : 'terminada') : 'error ' + j.code) : 'en curso' },
    { t: 'Día', f: (j) => j.done ? '' : `${j.day} / ${fmt(j.of, 0)}` }, { t: 'Tiempo', f: (j) => j.seconds + ' s' }, { t: '', f: (j) => j.done ? el('button', { class: 'btn sec', onclick: () => open(j.name) }, 'Analizar') : el('button', { class: 'btn sec', onclick: async () => { await api('/api/stop', { name: j.name }); } }, 'Parar') }], jobs) : el('p', { class: 'note' }, 'Ninguna todavía.'));
}
async function open(name) { S.run = name; S.data = null; go('result'); }

async function viewRuns() {
  const root = $('#v-runs'); root.replaceChildren(el('h2', { style: 'margin-top:0' }, 'Partidas guardadas'), el('p', { class: 'note' }, 'Cada fila es un fichero .db de telemetría. Pulsa una para analizarla.'));
  S.runs = await api('/api/runs');
  root.append(table([{ t: 'Partida', l: 1, k: 'name' }, { t: 'Semilla', k: 'seed' }, { t: 'Días', k: 'days' }, { t: 'Clanes', k: 'clans' }, { t: 'Vivos', k: 'alive' }, { t: 'Muertos', k: 'dead' }, { t: 'Estado', l: 1, f: (r) => r.running ? 'en curso' : r.closed ? 'cerrada' : 'incompleta' },
    { t: 'Tamaño', f: (r) => fmt(r.size / 1048576, 1) + ' MB' }, { t: '', f: (r) => el('button', { class: 'btn sec', onclick: async (e) => { e.stopPropagation(); if (confirm('¿Borrar ' + r.name + '?')) { await api('/api/delete', { name: r.name }); viewRuns(); } } }, 'Borrar') }], S.runs, { onrow: (r) => open(r.name) }));
}

// ------------------------------------------------------------------------------------------------ the analysis of one run
async function viewResult() {
  const root = $('#v-result');
  if (!S.run) { root.replaceChildren(el('p', { class: 'note' }, 'Elige una partida en «Partidas» o lanza una.')); return; }
  root.replaceChildren(el('p', { class: 'note' }, 'Cargando ' + S.run + '…'));
  try { S.data = await api('/api/run?name=' + encodeURIComponent(S.run)); } catch (e) { root.replaceChildren(el('p', { class: 'bad' }, e.message)); return; }
  const d = S.data, clans = Object.keys(d.series).sort((a, b) => a - b), col = (c) => COLORS[+c % 8];
  const days = d.info.sim_seconds / 1200;
  root.replaceChildren(
    el('h2', { style: 'margin-top:0' }, S.run, ' ', el('span', { class: 'pill' }, `${fmt(days, 1)} días · ${fmt(days / 4, 1)} años · semilla ${d.info.seed}${d.info.closed ? '' : ' · incompleta'}`)),
    section('Qué ha ocurrido', 'Lectura automática de los datos: apunta dónde mirar, no es un veredicto.', el('div', {}, d.narrative.map((n) => el('div', { class: 'find ' + n.level }, el('b', {}, n.title), n.text)))),
    section('Indicadores por clan', 'Estado final de cada clan. Pulsa un clan para ver su ficha.', kpis(d, clans)),
    section('Evolución comparativa de los clanes', 'Serie temporal de cada clan en la misma escala.', tabs('evo', ['Población', 'Días de comida', 'Edificios', 'Pirámide (nivel)', 'Camas'], (n) => {
      const key = { 'Población': 'alive', 'Días de comida': 'food_days', 'Edificios': 'buildings', 'Camas': 'beds' }[n], tier = { survival: 1, safety: 2, warmth: 3, growth: 4 };
      return chartCard(n, n === 'Pirámide (nivel)' ? '1 supervivencia · 2 seguridad · 3 calor · 4 crecimiento' : '', (h) => lineChart(h, clans.map((c) => ({ name: 'clan ' + c, color: col(c), pts: d.series[c].map((r) => [r.day, n === 'Pirámide (nivel)' ? tier[r.tier] || 0 : r[key]]) })), { step: key === 'buildings' || key === 'beds' || n.startsWith('Pir'), h: 260, min: n.startsWith('Pir') ? 0 : undefined }));
    })),
    section('Necesidades cubiertas', 'Porcentaje de las muestras de cada día en que la necesidad está por encima del umbral (30; salud 50). Es el KPI de si el clan vive bien, no solo de si vive.', tabs('needs', ['hunger', 'thirst', 'rest', 'warmth', 'health'], (n) =>
      el('div', { class: 'grid' }, chartCard('Cubierta (%)', '', (h) => lineChart(h, clans.map((c) => ({ name: 'clan ' + c, color: col(c), pts: (d.needs[c] || []).map((r) => [r.day, r[n + '_covered']]) })), { min: 0, max: 100 })),
        chartCard('Nivel medio (0-100)', '', (h) => lineChart(h, clans.map((c) => ({ name: 'clan ' + c, color: col(c), pts: (d.needs[c] || []).map((r) => [r.day, r[n + '_mean']]) })), { min: 0, max: 100 }))))),
    section('Tecnologías', 'Cuándo conoció cada clan cada tecnología (día simulado).', techs(d, clans)),
    section('Edificios', 'Obras terminadas o iniciadas que cuentan los miembros.', buildings(d, clans)),
    section('Religión, creencias y ritos', 'Lo que el clan cree (tabúes, presagios, chamán, lugar sagrado) y sus tradiciones y normas.', beliefs(d, clans)),
    section('Relaciones entre clanes', 'Actitud, hostilidad y rencor por pareja de clanes, y qué eventos las movieron.', relations(d)),
    section('Vínculos y genealogía', 'Árbol familiar por clan y los vínculos más fuertes entre miembros.', family(d, clans)),
    section('Flora y recursos del mundo', 'Qué había al inicio y cuánto queda. La fauna no se simula en GBSim todavía.', world(d)),
    section('Decisiones y tareas', 'Qué elige hacer cada clan (por cambio de decisión), cómo acaban las tareas y los bucles detectados.', decisions(d, clans)),
    section('Muertes', '', table([{ t: 'Día', f: (r) => fmt(r.t / 1200, 2) }, { t: 'Clan', k: 'clan' }, { t: 'Quién', l: 1, k: 'who' }, { t: 'Causa', l: 1, k: 'kind' }, { t: 'A manos de', l: 1, f: (r) => r.other || '—' }], d.deaths)));
}
const section = (title, note, body) => el('div', {}, el('h2', {}, title), note ? el('p', { class: 'note' }, note) : null, body);

function kpis(d, clans) {
  const rows = clans.map((c) => { const f = d.stats.final[c] || {}, s = d.series[c], t = d.stats.tiers[c] || {}, tot = Object.values(t).reduce((a, b) => a + b, 0) || 1, nd = d.needs[c] || [];
    const cov = (n) => nd.length ? nd.reduce((a, r) => a + r[n + '_covered'], 0) / nd.length : null;
    return { c, alive: f.alive, dead: f.dead, peak: Math.max(0, ...s.map((r) => r.alive)), start: s[0] ? s[0].alive : 0, food: f.food_days, bld: f.buildings, beds: f.beds, techs: (d.tech_timeline[c] || []).length,
      surv: Math.round(100 * (t.survival || 0) / tot), gro: Math.round(100 * (t.growth || 0) / tot), hun: cov('hunger'), thi: cov('thirst'), res: cov('rest'), war: cov('warmth'), hea: cov('health') }; });
  const pct = (v) => v == null ? '—' : fmt(v, 0) + '%';

function tree(host, ppl) {

  for (const p of ppl) { const [x, y] = pos.get(p.name), c = p.female ? 'var(--c5)' : 'var(--c0)', fill = p.alive ? c : 'var(--panel)';
