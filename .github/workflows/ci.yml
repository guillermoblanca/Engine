name: CI
on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xorg-dev libgl1-mesa-dev libgl1-mesa-dri xvfb
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DGB_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --config Release
      - name: Test (Linux, virtual display + Mesa software GL)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1280x720x24" ctest --test-dir build --output-on-failure
      - name: Test (Windows; GL tests skip without OpenGL 4.5)
        if: runner.os == 'Windows'
        run: ctest --test-dir build -C Release --output-on-failure
